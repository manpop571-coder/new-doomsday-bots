<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#100806">
  <title>Doomsday Farm Command</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css?v=20">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <div class="embers" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <button id="backBtn" class="round-btn" type="button" hidden aria-label="Back">‹</button>
      <div class="brand">
        <span id="eyebrow" class="eyebrow">CASTLE COMMAND</span>
        <h1 id="title">Doomsday</h1>
      </div>
      <button id="languageBtn" class="round-btn" type="button" aria-label="Language">🌐</button>
    </header>

    <section id="languageScreen" class="sheet" hidden></section>
    <section id="homeScreen" hidden></section>
    <section id="editorScreen" hidden></section>
    <section id="transferScreen" hidden></section>

    <div class="save-dock">
      <button id="saveBtn" class="gold-btn" type="button"></button>
      <div id="message" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="./app.js?v=21"></script>
</body>
</html>
