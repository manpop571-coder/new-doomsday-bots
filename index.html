<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://telegram.org; style-src 'self'; font-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="theme-color" content="#100806">
  <title>Doomsday Farm Command</title>
  <link rel="stylesheet" href="./style.css?v=25">
  <script src="https://telegram.org/js/telegram-web-app.js?63"></script>
</head>
<body>
  <div class="embers" aria-hidden="true"></div>
  <main class="shell">
    <header class="topbar">
      <button id="backBtn" class="round-btn" type="button" hidden aria-label="Back">‹</button>
      <div class="brand">
        <span id="eyebrow" class="eyebrow">CASTLE COMMAND</span>
        <h1 id="title">Doomsday</h1>
      </div>
      <button id="languageBtn" class="round-btn" type="button" aria-label="Language">🌐</button>
    </header>

    <section id="languageScreen" class="sheet" hidden></section>
    <section id="homeScreen" hidden></section>
    <section id="editorScreen" hidden></section>
    <section id="transferScreen" hidden></section>
    <section id="adminAddScreen" hidden></section>
    <section id="adminEditScreen" hidden></section>
    <section id="adminServersScreen" hidden></section>

    <div class="save-dock">
      <button id="saveBtn" class="gold-btn" type="button"></button>
      <div id="message" role="status" aria-live="polite"></div>
    </div>
  </main>
  <script src="./app.js?v=35"></script>
</body>
</html>
